<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ===== Config — injected by GitHub Actions =====
const APPS_SCRIPT_URL = "%%APPS_SCRIPT_URL%%";
const SHEETS_KEY = "%%SHEETS_KEY%%";
const APP_PASSWORD = "%%APP_PASSWORD%%";
const CLAUDE_API_KEY = "%%CLAUDE_API_KEY%%";
const LS_UNLOCKED = "peopleapp_v3_unlocked";
const LS_DISMISSED_REMINDERS = "peopleapp_dismissed_reminders";

// ===== Backend =====
async function callBackend(action, params={}) {
  const all={action,key:SHEETS_KEY,...params};
  const query=Object.entries(all).map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(typeof v==="object"?JSON.stringify(v):v)}`).join("&");
  const res=await fetch(`${APPS_SCRIPT_URL}?${query}`,{method:"GET"});
  const data=await res.json();
  if(data.error)throw new Error(data.error);
  return data;
}
async function uploadImageBackend(params){
  const res=await fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"uploadImage",key:SHEETS_KEY,...params})});
  const data=await res.json();
  if(data.error)throw new Error(data.error);
  return data;
}

// ===== Soft Earth Palette =====
const EARTH={bg:"#F5F0E8",surface:"#FDFAF5",surfaceAlt:"#F0EBE0",border:"#E8E0D0",text:"#2C2620",muted:"#8C7B6B",dim:"#B8A898",accent:"#7B9E87",accentLight:"#7B9E8722",pink:"#C4A0B8",pinkLight:"#C4A0B818",yellow:"#C4B87B",yellowLight:"#C4B87B18",link:"#C4A882",linkLight:"#C4A88244",selected:"#A67C5B",selectedLight:"#A67C5B22",inputBg:"#F0EBE0",btnPrimary:"#8B6250",btnPrimaryText:"#FDFAF5",danger:"#C47B6B",dangerLight:"#C47B6B18",shadow:"rgba(44,38,32,0.10)",gradBot:"rgba(245,240,232,0.97)",gradTop:"rgba(245,240,232,0.95)",handleBar:"rgba(44,38,32,0.12)"};
const CAT_COLORS={Work:"#7B8FA1",Family:"#C47B6B",Friends:"#7B9E87",Clients:"#B8956A",Personal:"#C4A0B8",Health:"#B8A86B",Community:"#9B8FC4",School:"#C4B87B"};
const PASTEL_POOL=["#C4A0B8","#B8C47B","#C4B87B","#A0B8C4","#B8A0C4","#C4A090","#A0C4B0","#C4C0A0"];

// ===== Helpers =====
function calcAge(b){if(!b)return null;const bd=new Date(b);if(isNaN(bd.getTime()))return null;const now=new Date();let age=now.getFullYear()-bd.getFullYear();if(now.getMonth()-bd.getMonth()<0||(now.getMonth()===bd.getMonth()&&now.getDate()<bd.getDate()))age--;return age;}
function formatDate(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d.getTime()))return iso;return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function daysSinceLastAbout(node){if(!node.about?.length)return null;const latest=node.about.reduce((a,b)=>new Date(a.date)>new Date(b.date)?a:b);return Math.floor((Date.now()-new Date(latest.date))/86400000);}
function upcomingBirthdays(nodes,withinDays=30){const now=new Date();return nodes.filter(n=>n.type==="person"&&n.birthday).map(n=>{const b=new Date(n.birthday);if(isNaN(b.getTime()))return null;let next=new Date(now.getFullYear(),b.getMonth(),b.getDate());if(next<now)next=new Date(now.getFullYear()+1,b.getMonth(),b.getDate());const daysUntil=Math.round((next-now)/86400000);return daysUntil<=withinDays?{node:n,daysUntil}:null;}).filter(Boolean).sort((a,b)=>a.daysUntil-b.daysUntil);}
function hashColor(id){let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))&0xFFFFFF;return PASTEL_POOL[Math.abs(h)%PASTEL_POOL.length];}
function personBaseColor(nodeId,allLinks,allNodes){const cl=allLinks.find(l=>{const catId=l.source===nodeId?l.target:l.target===nodeId?l.source:null;return catId&&allNodes.find(n=>n.id===catId)?.type==="category";});if(cl){const catId=cl.source===nodeId?cl.target:cl.source;const cat=allNodes.find(n=>n.id===catId);if(cat?.color)return cat.color;}return hashColor(nodeId);}
function nodeMainColor(node,allLinks,allNodes){if(node.id==="me")return"#8B6250";if(node.type==="category")return node.color||EARTH.muted;return personBaseColor(node.id,allLinks,allNodes);}

// ===== Obsidian-style node radius (connections + about entries + recency) =====
function getNodeRadius(node, centerId, isL2, allLinks) {
  if(node.id===centerId) return 36;
  if(isL2) return 10;
  if(node.type==="category") return 24;
  if(node.type!=="person") return 14;
  // Count connections (links to/from this person, excluding me→category links)
  const connCount = allLinks ? allLinks.filter(l=>(l.source===node.id||l.target===node.id)&&l.type!=="circle").length : 0;
  // Count about entries
  const aboutCount = node.about ? node.about.length : 0;
  // Recency bonus
  const days = daysSinceLastAbout(node);
  const recencyBonus = days===null ? 0 : days<7 ? 4 : days<30 ? 2 : days<90 ? 1 : 0;
  // Formula: base + connections weight + about weight + recency
  const radius = 12 + Math.min(connCount * 2, 8) + Math.min(aboutCount * 1.5, 8) + recencyBonus;
  return Math.min(Math.round(radius), 28);
}

// ===== Smart Reminders =====
function getReminders(nodes, fieldDefs) {
  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);
  const reminders = [];

  // Birthday reminders: warn 7 days before
  nodes.filter(n=>n.type==="person"&&n.birthday).forEach(n=>{
    const b = new Date(n.birthday);
    if(isNaN(b.getTime())) return;
    let next = new Date(now.getFullYear(), b.getMonth(), b.getDate());
    if(next < now) next = new Date(now.getFullYear()+1, b.getMonth(), b.getDate());
    const daysUntil = Math.round((next - now) / 86400000);
    if(daysUntil <= 7) {
      reminders.push({
        id: `bday_${n.id}_${next.getFullYear()}`,
        personId: n.id,
        personName: n.name,
        type: "birthday",
        emoji: "🎂",
        label: daysUntil===0 ? `${n.name.split(" ")[0]}'s birthday is TODAY!` : daysUntil===1 ? `${n.name.split(" ")[0]}'s birthday is tomorrow` : `${n.name.split(" ")[0]}'s birthday in ${daysUntil} days`,
        daysUntil,
      });
    }
  });

  // Custom important date fields: warn on the day
  if(fieldDefs) {
    nodes.filter(n=>n.type==="person").forEach(n=>{
      const importantIds = n.importantFieldIds || [];
      importantIds.forEach(fid=>{
        const fd = fieldDefs.find(f=>f.id===fid);
        if(!fd) return;
        const val = n.customValues?.[fid];
        if(!val) return;
        // Check if it's a date field or the value looks like a date
        const dateVal = new Date(val);
        if(isNaN(dateVal.getTime())) return;
        // Anniversary: same month+day as today
        const sameMonthDay = dateVal.getMonth()===now.getMonth() && dateVal.getDate()===now.getDate();
        // Or within 3 days
        let nextOccurrence = new Date(now.getFullYear(), dateVal.getMonth(), dateVal.getDate());
        if(nextOccurrence < now) nextOccurrence = new Date(now.getFullYear()+1, dateVal.getMonth(), dateVal.getDate());
        const daysUntil = Math.round((nextOccurrence - now) / 86400000);
        if(daysUntil <= 3) {
          reminders.push({
            id: `field_${n.id}_${fid}_${nextOccurrence.getFullYear()}`,
            personId: n.id,
            personName: n.name,
            type: "custom",
            emoji: "📅",
            label: daysUntil===0 ? `${fd.label} for ${n.name.split(" ")[0]} — TODAY` : `${fd.label} for ${n.name.split(" ")[0]} in ${daysUntil} day${daysUntil===1?"":"s"}`,
            daysUntil,
          });
        }
      });
    });
  }

  return reminders.sort((a,b)=>a.daysUntil-b.daysUntil);
}

function getDismissedReminders() {
  try { return JSON.parse(localStorage.getItem(LS_DISMISSED_REMINDERS)||"{}"); } catch(e) { return {}; }
}
function dismissReminder(id) {
  try {
    const d = getDismissedReminders();
    d[id] = new Date().toISOString().slice(0,10);
    localStorage.setItem(LS_DISMISSED_REMINDERS, JSON.stringify(d));
  } catch(e) {}
}
function snoozeReminder(id) {
  try {
    const d = getDismissedReminders();
    // Snooze until tomorrow
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate()+1);
    d[id] = "snooze_" + tomorrow.toISOString().slice(0,10);
    localStorage.setItem(LS_DISMISSED_REMINDERS, JSON.stringify(d));
  } catch(e) {}
}
function isReminderActive(reminder) {
  const d = getDismissedReminders();
  const val = d[reminder.id];
  if(!val) return true;
  if(val.startsWith("snooze_")) {
    const snoozeUntil = val.replace("snooze_","");
    return new Date().toISOString().slice(0,10) >= snoozeUntil;
  }
  // Dismissed: hide for today
  return val !== new Date().toISOString().slice(0,10);
}

// ===== Reminder Banner =====
function ReminderBanner({reminders, onDismiss, onSnooze, onPersonClick}) {
  const [index, setIndex] = useState(0);
  if(!reminders || reminders.length===0) return null;
  const r = reminders[index] || reminders[0];
  return (
    <div style={{
      position:"absolute", top:0, left:0, right:0, zIndex:40,
      background: r.type==="birthday" ? `linear-gradient(135deg, #C4A0B8ee, #C4B87bee)` : `linear-gradient(135deg, #7B9E87ee, #C4A882ee)`,
      borderBottom:`1px solid ${EARTH.border}`,
      boxShadow:`0 4px 16px ${EARTH.shadow}`,
      padding:"12px 16px",
      animation:"slideDown 0.3s ease-out",
    }}>
      <style>{`@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}`}</style>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:20,flexShrink:0}}>{r.emoji}</span>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:600,color:EARTH.surface,cursor:"pointer"}} onClick={()=>onPersonClick(r.personId)}>{r.label}</div>
          {reminders.length>1&&<div style={{fontSize:11,color:"rgba(255,255,255,0.7)",marginTop:2}}>{reminders.length} reminders — {index+1} of {reminders.length}</div>}
        </div>
        {reminders.length>1&&(
          <button onClick={()=>setIndex(i=>(i+1)%reminders.length)} style={{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:8,padding:"4px 8px",color:EARTH.surface,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>Next</button>
        )}
      </div>
      <div style={{display:"flex",gap:8,marginTop:10}}>
        {r.daysUntil > 0 && (
          <button onClick={()=>onSnooze(r.id)} style={{flex:1,padding:"7px 0",background:"rgba(255,255,255,0.2)",border:"1px solid rgba(255,255,255,0.3)",borderRadius:10,color:EARTH.surface,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
            Remind me day-of
          </button>
        )}
        <button onClick={()=>onDismiss(r.id)} style={{flex:1,padding:"7px 0",background:"rgba(255,255,255,0.35)",border:"1px solid rgba(255,255,255,0.3)",borderRadius:10,color:EARTH.surface,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
          Dismiss
        </button>
      </div>
    </div>
  );
}

function getNeighborGraph(centerId,allNodes,allLinks){const nIds=new Set([centerId]);const nLinks=[];allLinks.forEach(l=>{if(l.source===centerId){nIds.add(l.target);nLinks.push(l);}if(l.target===centerId){nIds.add(l.source);nLinks.push(l);}});return{neighborNodes:allNodes.filter(n=>nIds.has(n.id)),neighborLinks:nLinks,secondLevelIds:new Set()};}
function getTwoLevelGraph(centerId,allNodes,allLinks){const l1=new Set([centerId]);const l2=new Set();const used=[];allLinks.forEach(l=>{if(l.source===centerId){l1.add(l.target);used.push(l);}if(l.target===centerId){l1.add(l.source);used.push(l);}});allLinks.forEach(l=>{const inL1s=l1.has(l.source)&&l.source!==centerId;const inL1t=l1.has(l.target)&&l.target!==centerId;if(inL1s&&!l1.has(l.target)){l2.add(l.target);if(!used.includes(l))used.push(l);}if(inL1t&&!l1.has(l.source)){l2.add(l.source);if(!used.includes(l))used.push(l);}});const all=new Set([...l1,...l2]);return{neighborNodes:allNodes.filter(n=>all.has(n.id)),neighborLinks:used,secondLevelIds:l2};}

// ===== Layout =====
function computeLayout(centerId,allNodes,allLinks,width,height,twoLevel){const{neighborNodes,neighborLinks,secondLevelIds}=twoLevel?getTwoLevelGraph(centerId,allNodes,allLinks):getNeighborGraph(centerId,allNodes,allLinks);const pos={},vel={};const L1=neighborNodes.filter(n=>n.id!==centerId&&!secondLevelIds.has(n.id));const L2=neighborNodes.filter(n=>secondLevelIds.has(n.id));pos[centerId]={x:width/2,y:height/2};vel[centerId]={vx:0,vy:0};const r1=Math.min(width,height)*(twoLevel?0.26:0.30);L1.forEach((n,i)=>{const a=(i/(L1.length||1))*Math.PI*2-Math.PI/2;pos[n.id]={x:width/2+r1*Math.cos(a),y:height/2+r1*Math.sin(a)};vel[n.id]={vx:0,vy:0};});L2.forEach(n=>{const pl=neighborLinks.find(l=>(l.source===n.id&&L1.some(x=>x.id===l.target))||(l.target===n.id&&L1.some(x=>x.id===l.source)));const pid=pl?(L1.some(x=>x.id===pl.source)?pl.source:pl.target):null;const pp=pid&&pos[pid]?pos[pid]:{x:width/2,y:height/2};const sibs=L2.filter(x=>{const xl=neighborLinks.find(l2=>(l2.source===x.id&&L1.some(p=>p.id===l2.target))||(l2.target===x.id&&L1.some(p=>p.id===l2.source)));const xp=xl?(L1.some(p=>p.id===xl.source)?xl.source:xl.target):null;return xp===pid;});const si=sibs.indexOf(n);const a=(si/(sibs.length||1))*Math.PI*2-Math.PI/2;const r2=Math.min(width,height)*0.11;pos[n.id]={x:pp.x+r2*Math.cos(a),y:pp.y+r2*Math.sin(a)};vel[n.id]={vx:0,vy:0};});const startPos={};const ids=neighborNodes.map(n=>n.id);ids.forEach(id=>{startPos[id]={...pos[id]};});for(let step=0;step<280;step++){const alpha=Math.pow(0.975,step);if(alpha<0.006)break;const f={};ids.forEach(id=>{f[id]={fx:0,fy:0};});for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=ids[i],b=ids[j];if(!pos[a]||!pos[b])continue;const rep=(secondLevelIds.has(a)&&secondLevelIds.has(b))?300:1800;const dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;const dist=Math.sqrt(dx*dx+dy*dy)||1;const force=(rep*alpha)/(dist*dist);f[a].fx-=(dx/dist)*force;f[a].fy-=(dy/dist)*force;f[b].fx+=(dx/dist)*force;f[b].fy+=(dy/dist)*force;}neighborLinks.forEach(l=>{const a=l.source,b=l.target;if(!pos[a]||!pos[b])return;const isL2=secondLevelIds.has(a)||secondLevelIds.has(b);const td=isL2?Math.min(width,height)*0.10:Math.min(width,height)*0.24;const stiff=isL2?0.05:0.025;const dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;const dist=Math.sqrt(dx*dx+dy*dy)||1;const force=(dist-td)*stiff*alpha;const fx=(dx/dist)*force,fy=(dy/dist)*force;if(a!==centerId){f[a].fx+=fx;f[a].fy+=fy;}if(b!==centerId){f[b].fx-=fx;f[b].fy-=fy;}});ids.forEach(id=>{if(id===centerId||!pos[id])return;const pull=secondLevelIds.has(id)?0.003:0.012;f[id].fx+=(width/2-pos[id].x)*pull*alpha;f[id].fy+=(height/2-pos[id].y)*pull*alpha;vel[id].vx=(vel[id].vx+f[id].fx)*0.88;vel[id].vy=(vel[id].vy+f[id].fy)*0.88;pos[id]={x:Math.max(50,Math.min(width-50,pos[id].x+vel[id].vx)),y:Math.max(70,Math.min(height-90,pos[id].y+vel[id].vy))};});}return{finalPos:pos,startPos,neighborNodes,neighborLinks,secondLevelIds};}

function useAnimatedLayout(centerId,allNodes,allLinks,width,height,twoLevel,newNodeId){const[positions,setPositions]=useState({});const frameRef=useRef(null);const[pulseScale,setPulseScale]=useState({});useEffect(()=>{if(!width||!height)return;const{finalPos,startPos,neighborNodes}=computeLayout(centerId,allNodes,allLinks,width,height,twoLevel);const ids=neighborNodes.map(n=>n.id);const duration=420;const start=performance.now();function easeOut(t){return 1-Math.pow(1-t,3);}function animate(now){const t=Math.min(1,(now-start)/duration);const e=easeOut(t);const interp={};ids.forEach(id=>{if(!startPos[id]||!finalPos[id]){interp[id]=finalPos[id];return;}interp[id]={x:startPos[id].x+(finalPos[id].x-startPos[id].x)*e,y:startPos[id].y+(finalPos[id].y-startPos[id].y)*e};});setPositions(interp);if(t<1)frameRef.current=requestAnimationFrame(animate);}if(frameRef.current)cancelAnimationFrame(frameRef.current);frameRef.current=requestAnimationFrame(animate);return()=>{if(frameRef.current)cancelAnimationFrame(frameRef.current);};},[centerId,width,height,twoLevel]);useEffect(()=>{if(!newNodeId)return;let t=0;const iv=setInterval(()=>{t+=0.15;const scale=1+0.3*Math.sin(t)*Math.max(0,1-t/(Math.PI*3));setPulseScale(s=>({...s,[newNodeId]:scale}));if(t>Math.PI*3){setPulseScale(s=>({...s,[newNodeId]:1}));clearInterval(iv);}},30);return()=>clearInterval(iv);},[newNodeId]);return{positions,pulseScale};}

// ===== Avatar =====
function Avatar({node,r,color,isCenter,isSelected}){const hasPhoto=node?.photo;const initial=node?.name?.[0]||"?";const ringColor=isSelected?EARTH.selected:isCenter?EARTH.btnPrimary:"transparent";const ringW=isSelected?3:isCenter?2:0;return(<g><circle r={r+1} fill="transparent" style={{filter:`drop-shadow(0 2px 6px ${EARTH.shadow})`}}/><circle r={r+2} fill={EARTH.surface}/>{(isSelected||isCenter)&&<circle r={r+4} fill="transparent" stroke={ringColor} strokeWidth={ringW}/>}{hasPhoto?<image href={node.photo} x={-r} y={-r} width={r*2} height={r*2} clipPath="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>:<circle r={r} fill={color} fillOpacity={isCenter?1:0.9}/>}{!hasPhoto&&<text textAnchor="middle" dominantBaseline="central" fontSize={isCenter?r*0.5:r*0.55} fontWeight="700" fill={isCenter?"#FDFAF5":"rgba(255,255,255,0.95)"} style={{pointerEvents:"none",userSelect:"none"}}>{node.id==="me"?"✦":initial}</text>}{node?.type==="person"&&!isCenter&&(()=>{const days=daysSinceLastAbout(node);if(days===null)return null;const dotColor=days<7?EARTH.accent:days<30?EARTH.yellow:days<90?EARTH.pink:EARTH.dim;return (<circle cx={r*0.7} cy={-r*0.7} r={4} fill={dotColor} stroke={EARTH.surface} strokeWidth={1.5}/>);})()}</g>);}

// ===== Graph =====
function Graph({centerId,allNodes,allLinks,onNodeTap,onCenterTap,width,height,twoLevel,newNodeId,selectedId}){const{neighborNodes,neighborLinks,secondLevelIds}=twoLevel?getTwoLevelGraph(centerId,allNodes,allLinks):getNeighborGraph(centerId,allNodes,allLinks);const{positions,pulseScale}=useAnimatedLayout(centerId,allNodes,allLinks,width,height,twoLevel,newNodeId);return(<svg width={width} height={height} style={{position:"absolute",inset:0,background:EARTH.bg}}><defs><clipPath id="avatarClip"><circle r="100%"/></clipPath><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill={EARTH.link}/></marker><marker id="arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill={EARTH.dim}/></marker></defs>{neighborLinks.map((l,i)=>{const sp=positions[l.source],tp=positions[l.target];if(!sp||!tp)return null;const isL2=secondLevelIds.has(l.source)||secondLevelIds.has(l.target);const sn=neighborNodes.find(n=>n.id===l.source),tn=neighborNodes.find(n=>n.id===l.target);const sr=getNodeRadius(sn||{},centerId,secondLevelIds.has(l.source),allLinks)+3;const tr=getNodeRadius(tn||{},centerId,secondLevelIds.has(l.target),allLinks)+3;const dx=tp.x-sp.x,dy=tp.y-sp.y;const dist=Math.sqrt(dx*dx+dy*dy)||1;const x1=sp.x+(dx/dist)*sr,y1=sp.y+(dy/dist)*sr;const x2=tp.x-(dx/dist)*(tr+6),y2=tp.y-(dy/dist)*(tr+6);return<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={isL2?EARTH.dim:EARTH.link} strokeWidth={isL2?0.8:1.2} strokeOpacity={isL2?0.4:0.7} markerEnd={`url(#${isL2?"arr-m":"arr"})`}/>;})}{[...neighborNodes.filter(n=>secondLevelIds.has(n.id)),...neighborNodes.filter(n=>!secondLevelIds.has(n.id))].map(n=>{const p=positions[n.id];if(!p)return null;const isCenter=n.id===centerId,isL2=secondLevelIds.has(n.id),isSelected=n.id===selectedId;const r=getNodeRadius(n,centerId,isL2,allLinks);const color=nodeMainColor(n,allLinks,allNodes);const scale=pulseScale[n.id]||1;return(<g key={n.id} transform={`translate(${p.x},${p.y}) scale(${scale})`} style={{cursor:isCenter?"default":"pointer"}} onClick={()=>isCenter?onCenterTap(n):onNodeTap(n)}>{isSelected&&<circle r={r+7} fill={EARTH.selectedLight} stroke={EARTH.selected} strokeWidth={1.5}/>}<Avatar node={n} r={r} color={color} isCenter={isCenter} isSelected={isSelected}/>{!isL2&&<text y={r+16} textAnchor="middle" fontSize={isCenter?12:10} fontWeight={isCenter?"700":"500"} fill={EARTH.text} style={{pointerEvents:"none",userSelect:"none"}}>{n.name.split(" ")[0]}</text>}{isL2&&<text y={r+11} textAnchor="middle" fontSize={8} fill={EARTH.muted} style={{pointerEvents:"none",userSelect:"none"}}>{n.name.split(" ")[0]}</text>}</g>);})}</svg>);}

alignItems:"center",gap:10,marginBottom:12,padding:"8px 12px",background:EARTH.inputBg,borderRadius:10,border:`1px solid ${EARTH.border}`}}><div style={{width:26,height:26,borderRadius:"50%",background:`${pColor}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:pColor}}>{selected?.name[0]}</div><span style={{fontSize:14,color:EARTH.text,flex:1}}>{selected?.name}</span><button onClick={()=>setSelectedId(null)} style={{background:"none",border:"none",color:EARTH.muted,cursor:"pointer",fontSize:18,padding:0}}>×</button></div><input type="date" value={noteDate} onChange={e=>setNoteDate(e.target.value)} style={{...inp,marginBottom:8}}/><textarea value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="What happened?" autoFocus rows={3} style={{...inp,resize:"none",marginBottom:10,lineHeight:1.5}}/><button onClick={save} style={{...pbtn("primary"),width:"100%",fontSize:15,padding:13,marginBottom:6}}>Save note</button></>)}<button onClick={onCancel} style={{width:"100%",padding:13,background:"transparent",color:EARTH.muted,border:"none",fontSize:15,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button></div></div>);}

r(n.id,[],allNodes)}}>{n.name[0]}</div><div style={{flex:1}}><div style={{fontWeight:500}}>{n.name}</div>{n.birthday&&<div style={{fontSize:11,color:EARTH.muted}}>b. {formatDate(n.birthday)}</div>}</div><span style={{fontSize:12,color:EARTH.link}}>Open →</span></button>)}<div style={{fontSize:12,color:EARTH.muted,marginBottom:8}}>Not them? Add anyway:</div></div>)}<button onClick={()=>name.trim()&&onSave(name.trim())} style={{...pbtn("primary"),width:"100%",fontSize:15,padding:13,marginBottom:6}}>{duplicates.length>0?`Add "${name.trim()}" as new`:"Add person"}</button><button onClick={onCancel} style={{width:"100%",padding:13,background:"transparent",color:EARTH.muted,border:"none",fontSize:15,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button></div></div>);}

// ===== AI Chat Modal =====
async function callClaudeAI(message, people) {
  const peopleList = people.map(p => `- ${p.name} (id: ${p.id})${p.birthday ? `, birthday: ${p.birthday}` : ""}${p.about?.length ? `, last note: "${p.about[p.about.length-1]?.text}"` : ""}`).join("\n");
  const systemPrompt = `You are a personal CRM assistant. The user will tell you something about their life and you must figure out what to save and where.

People in their network:
${peopleList}

You must respond with ONLY a JSON array (no explanation, no markdown) of actions to take. Each action is one of:
- {"type":"about","personId":"<id>","date":"<YYYY-MM-DD>","text":"<note about this person>"}
- {"type":"birthday","personId":"<id>","date":"<YYYY-MM-DD>"}
- {"type":"field","personId":"<id>","fieldLabel":"<label>","value":"<value>"}

Today's date is ${new Date().toISOString().slice(0,10)}.
If you cannot match anyone, return [].
Only return actions you are confident about.`;

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": CLAUDE_API_KEY,
      "anthropic-version": "2023-06-01",
      "content-type": "application/json",
      "anthropic-dangerous-direct-browser-calls": "true",
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5",
      max_tokens: 512,
      system: systemPrompt,
      messages: [{ role: "user", content: message }],
    }),
  });
  if(!res.ok) throw new Error(`Claude API error: ${res.status}`);
  const data = await res.json();
  const text = data.content?.[0]?.text || "[]";
  try { return JSON.parse(text); } catch(e) { return []; }
}

function AIChatModal({allNodes, onSave, onCancel}) {
  const [text, setText] = useState("");
  const [status, setStatus] = useState("idle"); // idle | thinking | done | error
  const [result, setResult] = useState(null);
  const [errMsg, setErrMsg] = useState("");
  const people = allNodes.filter(n => n.type === "person");

  async function send() {
    if(!text.trim()) return;
    setStatus("thinking");
    setResult(null);
    setErrMsg("");
    try {
      const actions = await callClaudeAI(text.trim(), people);
      if(!actions || actions.length === 0) {
        setStatus("done");
        setResult([]);
        return;
      }
      // Save each action
      for(const a of actions) {
        await onSave(a);
      }
      setResult(actions);
      setStatus("done");
    } catch(e) {
      setErrMsg(e.message || "Something went wrong");
      setStatus("error");
    }
  }

  const personName = (id) => people.find(p => p.id === id)?.name || id;

  return (
    <div style={{position:"absolute",inset:0,background:"rgba(44,38,32,0.35)",backdropFilter:"blur(4px)",zIndex:35,display:"flex",alignItems:"flex-end"}}>
      <div style={{width:"100%",background:EARTH.surface,borderRadius:"20px 20px 0 0",border:`1px solid ${EARTH.border}`,boxShadow:`0 -4px 24px ${EARTH.shadow}`,padding:"20px 20px 44px"}}>
        <div style={handle}/>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
          <span style={{fontSize:20}}>✦</span>
          <div style={{fontSize:17,fontWeight:700,color:EARTH.text}}>Tell me anything</div>
        </div>
        <div style={{fontSize:13,color:EARTH.muted,marginBottom:14}}>I'll figure out who it's about and save it.</div>
        <textarea
          value={text}
          onChange={e=>setText(e.target.value)}
          placeholder={"Met Dror for coffee today\nRonit's surgery is on Nov 15\nDad's birthday is March 3"}
          rows={4}
          autoFocus
          disabled={status==="thinking"}
          style={{...inp,resize:"none",marginBottom:12,lineHeight:1.6,fontSize:15}}
        />
        {status==="thinking"&&(
          <div style={{textAlign:"center",padding:"12px 0",color:EARTH.muted,fontSize:14}}>✦ Thinking...</div>
        )}
        {status==="done"&&result!==null&&(
          <div style={{marginBottom:12,padding:"10px 14px",background:EARTH.accentLight,borderRadius:12,border:`1px solid ${EARTH.accent}40`}}>
            {result.length===0
              ? <div style={{fontSize:13,color:EARTH.muted}}>Couldn't match anyone in your network — try being more specific.</div>
              : result.map((a,i) => (
                <div key={i} style={{fontSize:13,color:EARTH.text,padding:"3px 0"}}>
                  ✓ {a.type==="about" ? `Note for ${personName(a.personId)}: "${a.text}"` : a.type==="birthday" ? `Birthday for ${personName(a.personId)}: ${a.date}` : `${a.fieldLabel} for ${personName(a.personId)}: ${a.value}`}
                </div>
              ))
            }
          </div>
        )}
        {status==="error"&&(
          <div style={{marginBottom:12,padding:"10px 14px",background:EARTH.dangerLight,borderRadius:12,border:`1px solid ${EARTH.danger}40`,fontSize:13,color:EARTH.danger}}>{errMsg}</div>
        )}
        {status!=="thinking"&&status!=="done"&&(
          <button onClick={send} disabled={!text.trim()} style={{...pbtn("primary"),width:"100%",fontSize:15,padding:13,marginBottom:6,opacity:!text.trim()?0.4:1}}>
            ✦ Save
          </button>
        )}
        {status==="done"&&(
          <button onClick={()=>{setText("");setStatus("idle");setResult(null);}} style={{...pbtn("secondary"),width:"100%",fontSize:15,padding:13,marginBottom:6}}>
            Tell me more
          </button>
        )}
        <button onClick={onCancel} style={{width:"100%",padding:13,background:"transparent",color:EARTH.muted,border:"none",fontSize:15,cursor:"pointer",fontFamily:"inherit"}}>
          {status==="done"?"Done":"Cancel"}
        </button>
      </div>
    </div>
  );
}

// ===== Main App =====
function MainApp(){
  const containerRef=useRef(null);
  const[dims,setDims]=useState({width:0,height:0});
  const[loading,setLoading]=useState(true);
  const[loadError,setLoadError]=useState(null);
  const[saving,setSaving]=useState(false);
  const[nodes,setNodes]=useState([{id:"me",name:"You",type:"me"}]);
  const[links,setLinks]=useState([]);
  const[fieldDefs,setFieldDefs]=useState([]);
  const[navStack,setNavStack]=useState([]);
  const[centerId,setCenterId]=useState("me");
  const[activeCardId,setActiveCardId]=useState(null);
  const[activeCardRel,setActiveCardRel]=useState("");
  const[showMeCard,setShowMeCard]=useState(false);
  const[showQuickNote,setShowQuickNote]=useState(false);
  const[showAIChat,setShowAIChat]=useState(false);
  const[addModalCenter,setAddModalCenter]=useState(null);
  const[search,setSearch]=useState("");
  const[newNodeId,setNewNodeId]=useState(null);
  const[activeReminders,setActiveReminders]=useState([]);

  useEffect(()=>{const el=containerRef.current;if(!el)return;const obs=new ResizeObserver(entries=>{const{width,height}=entries[0].contentRect;setDims({width,height});});obs.observe(el);return()=>obs.disconnect();},[]);

  async function loadData(){
    setLoading(true);setLoadError(null);
    try{
      const data=await callBackend("getAllData");
      const people=(data.people||[]).map(p=>({...p,about:p.about||[],customValues:p.customValues||{},importantFieldIds:p.importantFieldIds||[],photo:p.imageUrl||null}));
      const catColorMap={Work:"#7B8FA1",Family:"#C47B6B",Friends:"#7B9E87",Clients:"#B8956A",Personal:"#C4A0B8",Health:"#B8A86B",Community:"#9B8FC4",School:"#C4B87B"};
      const cats=(data.categories||[]).map(c=>({id:c.name,name:c.name,type:"category",color:catColorMap[c.name]||hashColor(c.name),imageUrl:c.imageUrl}));
      const meNode={id:"me",name:"You",type:"me"};
      const allPeople=[meNode,...cats,...people];
      setNodes(allPeople);
      const rels=(data.relationships||[]).map(r=>({source:r.personA,target:r.personB,type:r.type}));
      const catLinks=cats.map(c=>({source:"me",target:c.id,type:"circle"}));
      const peopleLinks=[];
      people.forEach(p=>{(p.categories||[]).forEach(catName=>{const cat=cats.find(c=>c.name===catName);if(cat)peopleLinks.push({source:cat.id,target:p.id,type:catName.toLowerCase()});});});
      setLinks([...catLinks,...rels,...peopleLinks]);
      setFieldDefs((data.fieldDefs||[]).map(f=>({...f,important:f.important===true||f.important==="TRUE"||f.important==="true"})));
      // Compute reminders after data load
      const allReminders = getReminders(allPeople, data.fieldDefs||[]);
      setActiveReminders(allReminders.filter(isReminderActive));
    }catch(err){setLoadError(err.message||"Couldn't reach your Google Sheet.");}
    finally{setLoading(false);}
  }
  useEffect(()=>{loadData();},[]);

  const isDesktop=dims.width>=768;
  const isHome=navStack.length===0&&centerId==="me";
  const centerNode=nodes.find(n=>n.id===centerId);
  const activePerson=nodes.find(n=>n.id===activeCardId);
  const meNode=nodes.find(n=>n.id==="me");
  const birthdays=upcomingBirthdays(nodes,30);
  const stats={people:nodes.filter(n=>n.type==="person").length,categories:nodes.filter(n=>n.type==="category").length,connections:links.filter(l=>l.type!=="circle").length,about:nodes.filter(n=>n.type==="person").reduce((s,n)=>s+(n.about?.length||0),0)};
  const panelWidth=isDesktop&&activePerson?320:0;
  const graphWidth=dims.width-panelWidth;
  // Banner height offset for graph
  const bannerHeight = activeReminders.length > 0 ? 100 : 0;

  function onNodeTap(node){setNavStack(s=>[...s,centerId]);setCenterId(node.id);setActiveCardId(null);setShowMeCard(false);}
  function onCenterTap(node){if(node.id==="me"){setShowMeCard(true);return;}if(node.type==="person"){const rel=links.find(l=>(l.source===navStack[navStack.length-1]&&l.target===node.id)||(l.target===navStack[navStack.length-1]&&l.source===node.id));setActiveCardRel(rel?.type||"");setActiveCardId(node.id);}}
  function navigateTo(nodeId){setNavStack(s=>[...s,centerId]);setCenterId(nodeId);setActiveCardId(null);setShowMeCard(false);}
  function goBack(){if(activeCardId&&!isDesktop){setActiveCardId(null);return;}if(showMeCard){setShowMeCard(false);return;}if(navStack.length>0){const prev=navStack[navStack.length-1];setNavStack(s=>s.slice(0,-1));setCenterId(prev);}}

  function handleDismissReminder(id) {
    dismissReminder(id);
    setActiveReminders(r => r.filter(x => x.id !== id));
  }
  function handleSnoozeReminder(id) {
    snoozeReminder(id);
    setActiveReminders(r => r.filter(x => x.id !== id));
  }

  async function updatePerson(id,patch){
    if(patch._newConn){setLinks(prev=>[...prev,{source:id,target:patch._newConn.target,type:patch._newConn.type}]);setSaving(true);try{await callBackend("addRelationship",{personA:id,personB:patch._newConn.target,type:patch._newConn.type});}catch(e){console.error(e);}finally{setSaving(false);}return;}
    setNodes(prev=>prev.map(n=>n.id===id?{...n,...patch}:n));
    if(id==="me")return;
    setSaving(true);
    try{
      await callBackend("updatePerson",{id,...(patch.name?{name:patch.name}:{}),(patch.birthday!==undefined)?{birthDate:patch.birthday}:{}});
      if(patch.customValues){for(const[fieldId,value]of Object.entries(patch.customValues)){await callBackend("setFieldValue",{personId:id,fieldId,value});}}
      if(patch.about){const existing=nodes.find(n=>n.id===id)?.about||[];const newEntries=patch.about.filter(e=>!existing.some(x=>x.date===e.date&&x.text===e.text));for(const entry of newEntries){await callBackend("addAbout",{personId:id,date:entry.date,text:entry.text});}}
    }catch(e){console.error(e);}finally{setSaving(false);}
  }

  async function deletePerson(id){setNodes(prev=>prev.filter(n=>n.id!==id));setLinks(prev=>prev.filter(l=>l.source!==id&&l.target!==id));setActiveCardId(null);if(centerId===id){const prev=navStack[navStack.length-1]||"me";setNavStack(s=>s.slice(0,-1));setCenterId(prev);}}

  async function addPerson(name){
    setSaving(true);
    try{const res=await callBackend("addPerson",{name,categories:[]});const id=res.id;setNodes(prev=>[...prev,{id,name,type:"person",birthday:"",about:[],customValues:{},importantFieldIds:[],photo:null}]);if(addModalCenter&&addModalCenter.id!=="me"&&addModalCenter.type==="category"){setLinks(prev=>[...prev,{source:addModalCenter.id,target:id,type:addModalCenter.name.toLowerCase()}]);}setNewNodeId(id);setAddModalCenter(null);setTimeout(()=>{setActiveCardId(id);setActiveCardRel("");},100);setTimeout(()=>setNewNodeId(null),2000);}
    catch(e){console.error(e);}finally{setSaving(false);}
  }

  async function saveQuickNote(personId,entry){setNodes(prev=>prev.map(n=>n.id===personId?{...n,about:[...n.about,entry]}:n));setShowQuickNote(false);setSaving(true);try{await callBackend("addAbout",{personId,date:entry.date,text:entry.text});}catch(e){console.error(e);}finally{setSaving(false);};}

  async function addFieldDef(def){setFieldDefs(prev=>[...prev,def]);try{await callBackend("addFieldDef",{label:def.label,type:def.type,important:false});}catch(e){console.error(e);}}

  // AI Chat save handler — handles each action from Claude
  async function handleAISave(action) {
    if(action.type === "about") {
      const entry = { date: action.date || new Date().toISOString().slice(0,10), text: action.text };
      setNodes(prev => prev.map(n => n.id === action.personId ? {...n, about: [...(n.about||[]), entry]} : n));
      await callBackend("addAbout", { personId: action.personId, date: entry.date, text: entry.text });
    } else if(action.type === "birthday") {
      setNodes(prev => prev.map(n => n.id === action.personId ? {...n, birthday: action.date} : n));
      await callBackend("updatePerson", { id: action.personId, birthDate: action.date });
    } else if(action.type === "field") {
      // Find or create field def
      let fd = fieldDefs.find(f => f.label.toLowerCase() === action.fieldLabel.toLowerCase());
      if(!fd) {
        const newId = "f"+Date.now();
        fd = { id: newId, label: action.fieldLabel, type: "text" };
        setFieldDefs(prev => [...prev, fd]);
        await callBackend("addFieldDef", { label: fd.label, type: "text", important: false });
      }
      setNodes(prev => prev.map(n => n.id === action.personId ? {...n, customValues: {...(n.customValues||{}), [fd.id]: action.value}} : n));
      await callBackend("setFieldValue", { personId: action.personId, fieldId: fd.id, value: action.value });
    }
  }

  function buildBreadcrumb(targetId){if(targetId==="me")return[];const path=[targetId];let current=targetId;const visited=new Set([current]);for(let i=0;i<10;i++){const pl=links.find(l=>{if(l.target===current&&!visited.has(l.source))return true;if(l.source===current&&!visited.has(l.target))return true;return false;});if(!pl)break;const pid=pl.source===current?pl.target:pl.source;visited.add(pid);path.unshift(pid);if(pid==="me")break;current=pid;}return path;}
  const breadcrumb=centerId==="me"?[]:buildBreadcrumb(centerId);
  const searchResults=search.trim()?nodes.filter(n=>n.type==="person"&&n.name.toLowerCase().includes(search.toLowerCase())):[];

  if(loading)return <LoadingScreen/>;
  if(loadError)return <ErrorScreen message={loadError} onRetry={loadData}/>;

  return(
    <div ref={containerRef} style={{width:"100%",height:"100vh",background:EARTH.bg,color:EARTH.text,fontFamily:"'Inter','Segoe UI',sans-serif",position:"relative",overflow:"hidden"}}>
      {dims.width>0&&<Graph centerId={centerId} allNodes={nodes} allLinks={links} onNodeTap={onNodeTap} onCenterTap={onCenterTap} width={graphWidth||dims.width} height={dims.height} twoLevel={isHome} newNodeId={newNodeId} selectedId={activeCardId}/>}
      {saving&&<div style={{position:"absolute",top:12,right:12,fontSize:11,color:EARTH.muted,background:EARTH.surface,padding:"4px 10px",borderRadius:8,zIndex:50,border:`1px solid ${EARTH.border}`,boxShadow:`0 1px 4px ${EARTH.shadow}`}}>Saving…</div>}

      {/* Reminder Banner */}
      {activeReminders.length > 0 && (
        <ReminderBanner
          reminders={activeReminders}
          onDismiss={handleDismissReminder}
          onSnooze={handleSnoozeReminder}
          onPersonClick={(personId) => { setActiveCardId(personId); setActiveCardRel(""); }}
        />
      )}

      <div style={{position:"absolute",top:activeReminders.length>0?bannerHeight:0,left:0,right:isDesktop&&activePerson?320:0,padding:"14px 20px",display:"flex",alignItems:"center",gap:10,background:`linear-gradient(to bottom, ${EARTH.gradTop} 60%, transparent)`,zIndex:10,transition:"top 0.3s ease"}}>
        {!isHome&&<button onClick={goBack} style={{width:34,height:34,borderRadius:10,background:EARTH.surface,border:`1px solid ${EARTH.border}`,color:EARTH.text,fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:`0 1px 4px ${EARTH.shadow}`}}>←</button>}
        <div style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:EARTH.muted,flex:1,overflow:"hidden"}}>
          {!isHome&&breadcrumb.map((id,i)=>{const n=nodes.find(x=>x.id===id);const label=id==="me"?"You":(n?.name?.split(" ")[0]||id);const isLast=i===breadcrumb.length-1;return(<span key={i} style={{display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"}}>{isLast?<span style={{color:EARTH.text,fontWeight:600}}>{label}</span>:<button onClick={()=>{setNavStack(breadcrumb.slice(0,i));setCenterId(id);setActiveCardId(null);setShowMeCard(false);}} style={{background:"none",border:"none",cursor:"pointer",color:EARTH.muted,fontSize:13,padding:0,fontFamily:"inherit",textDecoration:"underline",textDecorationColor:EARTH.border}}>{label}</button>}{!isLast&&<span style={{opacity:0.4}}>→</span>}</span>);})}
          {isHome&&<span style={{fontSize:14,fontWeight:600,color:EARTH.text}}>My people</span>}
        </div>
        {!isHome&&<button onClick={()=>setAddModalCenter(centerNode)} style={{width:34,height:34,borderRadius:10,background:EARTH.surface,border:`1px solid ${EARTH.border}`,color:EARTH.text,fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 1px 4px ${EARTH.shadow}`}}>+</button>}
      </div>

      {isHome&&(
        <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"16px 20px 40px",background:`linear-gradient(to top, ${EARTH.gradBot} 60%, transparent)`,zIndex:10}}>
          {birthdays.length>0&&(
            <div style={{marginBottom:12,background:`linear-gradient(135deg, ${EARTH.pinkLight}, ${EARTH.yellowLight})`,borderRadius:14,padding:"10px 14px",border:`1px solid ${EARTH.pink}30`,boxShadow:`0 2px 8px ${EARTH.shadow}`}}>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:EARTH.muted,textTransform:"uppercase",marginBottom:8}}>🎂 Upcoming birthdays</div>
              {birthdays.map(({node:n,daysUntil})=>(
                <div key={n.id} onClick={()=>{setActiveCardId(n.id);setActiveCardRel("");}} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",cursor:"pointer",borderBottom:`1px solid ${EARTH.border}`}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:22,height:22,borderRadius:"50%",background:`${personBaseColor(n.id,links,nodes)}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:personBaseColor(n.id,links,nodes)}}>{n.name[0]}</div><span style={{fontSize:13,color:EARTH.text}}>{n.name.split(" ")[0]}</span></div>
                  <span style={{fontSize:12,color:EARTH.muted}}>{daysUntil===0?"Today!":daysUntil===1?"Tomorrow":`In ${daysUntil} days`}</span>
                </div>
              ))}
            </div>
          )}
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search people..." style={{...inp,flex:1,fontSize:15,borderRadius:14,boxShadow:`0 1px 4px ${EARTH.shadow}`}}/>
            <button onClick={()=>setShowQuickNote(true)} title="Quick note" style={{width:48,height:48,borderRadius:14,background:EARTH.surface,border:`1px solid ${EARTH.border}`,color:EARTH.btnPrimary,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:`0 1px 4px ${EARTH.shadow}`}}>✎</button>
          </div>
          {searchResults.length>0&&<div style={{background:EARTH.surface,border:`1px solid ${EARTH.border}`,borderRadius:14,overflow:"hidden",marginBottom:10,boxShadow:`0 2px 8px ${EARTH.shadow}`}}>{searchResults.map(n=><div key={n.id} onClick={()=>{setSearch("");setActiveCardId(n.id);setActiveCardRel("");}} style={{padding:"11px 16px",borderBottom:`1px solid ${EARTH.border}`,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",gap:10,color:EARTH.text}}><div style={{width:28,height:28,borderRadius:"50%",background:`${personBaseColor(n.id,links,nodes)}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:personBaseColor(n.id,links,nodes)}}>{n.name[0]}</div>{n.name}</div>)}</div>}
          <button onClick={()=>setAddModalCenter(nodes.find(n=>n.id==="me"))} style={{...pbtn("primary"),width:"100%",fontSize:15,padding:13,borderRadius:14,boxShadow:`0 2px 8px ${EARTH.shadow}`}}>+ Add person</button>
        </div>
      )}

      {/* AI Chat floating button */}
      <button
        onClick={()=>setShowAIChat(true)}
        title="AI Chat — tell me anything"
        style={{
          position:"absolute", bottom: isHome ? 180 : 24, right:20, zIndex:15,
          width:52, height:52, borderRadius:"50%",
          background:EARTH.btnPrimary, border:"none",
          color:EARTH.btnPrimaryText, fontSize:20,
          cursor:"pointer", boxShadow:`0 4px 16px ${EARTH.shadow}`,
          display:"flex", alignItems:"center", justifyContent:"center",
          transition:"bottom 0.3s ease",
        }}
      >✦</button>

      {showMeCard&&(<><div onClick={()=>setShowMeCard(false)} style={{position:"absolute",inset:0,zIndex:15}}/><MeCard me={meNode} stats={stats} onClose={()=>setShowMeCard(false)} onUpdate={updatePerson}/></>)}
      {activePerson&&(<>{!isDesktop&&<div onClick={()=>setActiveCardId(null)} style={{position:"absolute",inset:0,zIndex:15,background:"rgba(44,38,32,0.15)"}}/>}<PersonCard person={nodes.find(n=>n.id===activeCardId)||activePerson} relType={activeCardRel} allNodes={nodes} allLinks={links} fieldDefs={fieldDefs} onClose={()=>setActiveCardId(null)} onNavigate={navigateTo} onUpdate={updatePerson} onAddFieldDef={addFieldDef} onDelete={deletePerson} isSidePanel={isDesktop} saving={saving}/></>)}
      {showQuickNote&&<QuickNoteModal allNodes={nodes} onSave={saveQuickNote} onCancel={()=>setShowQuickNote(false)}/>}
      {showAIChat&&<AIChatModal allNodes={nodes} onSave={handleAISave} onCancel={()=>setShowAIChat(false)}/>}
      {addModalCenter&&<AddPersonModal centerNode={addModalCenter} allNodes={nodes} onSave={addPerson} onOpenExisting={id=>{setAddModalCenter(null);setActiveCardId(id);setActiveCardRel("");}} onCancel={()=>setAddModalCenter(null)}/>}
    </div>
  );
}

// ===== Root =====
function Root(){const[unlocked,setUnlocked]=useState(localStorage.getItem(LS_UNLOCKED)==="1");if(!unlocked)return <LockScreen onUnlock={()=>setUnlocked(true)}/>;return <MainApp/>;}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
