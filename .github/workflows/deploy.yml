name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into index.html
        run: |
          sed -i "s|%%APPS_SCRIPT_URL%%|${{ secrets.APPS_SCRIPT_URL }}|g" index.html
          sed -i "s|%%SHEETS_KEY%%|${{ secrets.SHEETS_KEY }}|g" index.html
          sed -i "s|%%APP_PASSWORD%%|${{ secrets.APP_PASSWORD }}|g" index.html
          sed -i "s|%%CLAUDE_API_KEY%%|${{ secrets.CLAUDE_API_KEY }}|g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,.gitignore,*.gs,*.md,*.jsx'
